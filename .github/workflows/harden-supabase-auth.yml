name: Chaty Hosted Auth Hardening

on:
  push:
    branches: [integration/phases-1-8]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harden-auth:
    if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: dntnxeanubswyswahdnj
    steps:
      - uses: actions/checkout@v6
      - name: Enforce hosted password security
        run: bash tools/harden_supabase_auth.sh
