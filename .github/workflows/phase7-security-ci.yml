name: Phase 7 Platform Security Verification

on:
  push:
    branches: [phase-7-platform-security]
  pull_request:
    branches: [production-hardening-2026-08-22]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Hosted Supabase Auth security gate
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: dntnxeanubswyswahdnj
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo 'NOTICE: hosted Auth security gate was not executed because SUPABASE_ACCESS_TOKEN is not configured for this workflow.'
            echo 'This branch may pass code verification, but Phase 7 remains below 100% until the hosted Auth gate is run successfully.'
            exit 0
          fi
          bash tools/check_supabase_auth_security.sh

      - run: >-
          flutter build apk --release --no-pub
          --dart-define=SUPABASE_URL=https://dntnxeanubswyswahdnj.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_gFpVYJctaDkRRgttvnUl-A_TKu81hFF
