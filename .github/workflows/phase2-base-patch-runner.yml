name: Phase 2 Trusted Patch Runner

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [production-hardening-2026-08-22]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'phase-2-encrypted-attachments'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase-2-encrypted-attachments
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Execute reviewed Phase 2 patch body
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/phase2-patch-on-pr.yml')
          lines = workflow.read_text().splitlines()
          marker = '      - name: Apply reviewed encrypted attachment wire-up'
          start = lines.index(marker)
          run_line = next(i for i in range(start, len(lines)) if lines[i] == '        run: |')
          end = next(i for i in range(run_line + 1, len(lines)) if lines[i].startswith('      - name:'))
          body_lines = []
          for line in lines[run_line + 1:end]:
              if line.startswith('          '):
                  body_lines.append(line[10:])
              else:
                  body_lines.append(line)
          body = '\n'.join(body_lines) + '\n'
          old_helper = """def replace_once(text, old, new, label):
    if old not in text:
        raise SystemExit(f'Expected source block not found: {label}')
    return text.replace(old, new, 1)
"""
          new_helper = """def replace_once(text, old, new, label):
    if new in text:
        return text
    if old in text:
        return text.replace(old, new, 1)
    parts = [part for part in re.split(r'\\s+', old.strip()) if part]
    pattern = r'\\s+'.join(re.escape(part) for part in parts)
    match = re.search(pattern, text, flags=re.S)
    if match is None:
        raise SystemExit(f'Expected source block not found: {label}')
    return text[:match.start()] + new + text[match.end():]
"""
          if old_helper not in body:
              raise SystemExit('Phase 2 replace_once helper shape changed unexpectedly')
          body = body.replace(old_helper, new_helper, 1)
          Path('/tmp/phase2-reviewed-patch.sh').write_text(body)
          PY
          bash /tmp/phase2-reviewed-patch.sh

      - name: Commit source changes to Phase 2
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/
          git commit -m 'feat: wire encrypted attachments through MLS and local media'
          git push origin HEAD:phase-2-encrypted-attachments
