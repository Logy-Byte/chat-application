name: Chaty Android Production

on:
  push:
    branches:
      - main
      - production-supabase
      - production-hardening-2026-08-22
      - phase-2-encrypted-attachments
  pull_request:
    branches:
      - main
      - production-hardening-2026-08-22
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Phase 2 verified integration fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase-2-encrypted-attachments' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          mls = Path('lib/data/services/mls_e2ee_service.dart')
          text = mls.read_text()
          if "import 'dart:async';" not in text:
              text = text.replace(
                  "import 'dart:convert';",
                  "import 'dart:async';\nimport 'dart:convert';",
                  1,
              )
          old = """    await _requireEngine().mergePendingCommit(groupIdBytes: groupIdBytes);
    final newEpoch = (await _requireEngine().groupEpoch(
      groupIdBytes: groupIdBytes,
    )).toInt();

    try {
      await _client.rpc(
        'publish_mls_membership_update_v1',"""
          new = """    final newEpoch = group.epoch + 1;

    try {
      await _client.rpc(
        'publish_mls_membership_update_v1',"""
          if old in text:
              text = text.replace(old, new, 1)
          old = """    } catch (error) {
      // The local engine already advanced. Failing closed is safer than trying
      // to synthesize a rollback of MLS ratchet state.
      throw MlsE2eeException(
        'Server rejected the MLS membership commit after local advancement. Re-open this account on the device to resynchronize. ($error)',
      );
    }

    return _fetchState(conversationId, afterEpoch: newEpoch);"""
          new = """    } catch (error) {
      await _requireEngine().clearPendingCommit(groupIdBytes: groupIdBytes);
      throw MlsE2eeException(
        'Server rejected the pending MLS membership commit; local state was not advanced. ($error)',
      );
    }

    await _requireEngine().mergePendingCommit(groupIdBytes: groupIdBytes);
    final mergedEpoch = (await _requireEngine().groupEpoch(
      groupIdBytes: groupIdBytes,
    )).toInt();
    if (mergedEpoch != newEpoch) {
      throw MlsE2eeException(
        'MLS local epoch mismatch after commit: local=$mergedEpoch expected=$newEpoch.',
      );
    }
    return _fetchState(conversationId, afterEpoch: newEpoch);"""
          if old in text:
              text = text.replace(old, new, 1)
          if "import 'dart:async';" not in text:
              raise SystemExit('MLS dart:async import missing')
          if 'clearPendingCommit(groupIdBytes: groupIdBytes)' not in text:
              raise SystemExit('MLS pending commit is not cleared on publication rejection')
          if 'final newEpoch = group.epoch + 1;' not in text:
              raise SystemExit('MLS failure-atomic epoch calculation missing')
          mls.write_text(text)

          media = Path('lib/data/services/chat_media_service.dart')
          text = media.read_text().replace(
              "throw const FileSystemException('Downloaded attachment is empty.');",
              "throw FileSystemException('Downloaded attachment is empty.');",
          )
          media.write_text(text)

          detail = Path('lib/features/chats/chat_detail_screen.dart')
          text = detail.read_text()
          replacements = [
              (
                  """        builder: (_) => MediaViewerScreen(
          title: attachment.name,
          type: attachment.type,
          size: attachment.size,
          storagePath: attachment.url,
          theme: theme,
        ),""",
                  """        builder: (_) => MediaViewerScreen(
          theme: theme,
          conversationId: message.conversationId,
          attachment: attachment,
        ),""",
                  'view-once media viewer',
              ),
              (
                  """                      builder: (_) => MediaViewerScreen(
                        title: message.attachment!.name,
                        type: message.attachment!.type,
                        size: message.attachment!.size,
                        storagePath: message.attachment!.url,
                        theme: theme,
                      ),""",
                  """                      builder: (_) => MediaViewerScreen(
                        theme: theme,
                        conversationId: message.conversationId,
                        attachment: message.attachment!,
                      ),""",
                  'message media viewer',
              ),
          ]
          for old, new, label in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Expected Phase 2 caller missing: {label}')
              text = text.replace(old, new, 1)
          detail.write_text(text)

          contact = Path('lib/features/chats/contact_info_screen.dart')
          text = contact.read_text()
          old = """        builder: (_) => MediaViewerScreen(
          title: attachment.name,
          type: attachment.type,
          size: attachment.size,
          storagePath: attachment.url,
          theme: widget.theme,
        ),"""
          new = """        builder: (_) => MediaViewerScreen(
          theme: widget.theme,
          conversationId: message.conversationId,
          attachment: attachment,
        ),"""
          if new not in text:
              if old not in text:
                  raise SystemExit('Expected Phase 2 caller missing: contact media viewer')
              text = text.replace(old, new, 1)
          contact.write_text(text)
          PY
          dart format \
            lib/data/services/mls_e2ee_service.dart \
            lib/data/services/chat_media_service.dart \
            lib/features/chats/chat_detail_screen.dart \
            lib/features/chats/contact_info_screen.dart
          git diff --check

      - name: Toolchain
        run: |
          flutter --version
          dart --version
          java -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Provision verified OpenMLS Linux native asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tool
          cat > tool/openmls_ci_probe.dart <<'DART'
          import 'package:openmls/openmls.dart';

          Future<void> main() async {
            await Openmls.init();
            Openmls.cleanup();
          }
          DART
          dart run tool/openmls_ci_probe.dart
          rm -f tool/openmls_ci_probe.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test encrypted attachment crypto
        run: flutter test test/encrypted_attachment_codec_test.dart

      - name: Test
        run: flutter test

      - name: Hosted Auth release preflight
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: dntnxeanubswyswahdnj
        run: bash tools/check_supabase_auth_security.sh

      - name: Build release APK
        run: >-
          flutter build apk --release --no-pub
          --dart-define=SUPABASE_URL=https://dntnxeanubswyswahdnj.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_gFpVYJctaDkRRgttvnUl-A_TKu81hFF

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          cp "$APK" Chaty-production.apk
          unzip -t Chaty-production.apk >/dev/null
          sha256sum Chaty-production.apk | tee Chaty-production.apk.sha256
          ls -lh Chaty-production.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chaty-Production-APK
          path: |
            Chaty-production.apk
            Chaty-production.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified Phase 2 source fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase-2-encrypted-attachments' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/data/services/mls_e2ee_service.dart \
            lib/data/services/chat_media_service.dart \
            lib/features/chats/chat_detail_screen.dart \
            lib/features/chats/contact_info_screen.dart
          git commit -m 'fix: complete encrypted attachment release integration'
          git push origin HEAD:phase-2-encrypted-attachments
