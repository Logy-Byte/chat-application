name: Chaty Android Production

on:
  push:
    branches:
      - main
      - production-supabase
      - production-hardening-2026-08-22
      - phase-1-mls-e2ee
  pull_request:
    branches:
      - main
      - production-hardening-2026-08-22
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Phase 1 failure-atomic MLS patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase-1-mls-e2ee' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/data/services/mls_e2ee_service.dart')
          text = path.read_text(encoding='utf-8')
          if "import 'dart:async';" not in text:
              text = text.replace(
                  "import 'dart:convert';",
                  "import 'dart:async';\nimport 'dart:convert';",
                  1,
              )

          old = """    await _requireEngine().mergePendingCommit(groupIdBytes: groupIdBytes);
    final newEpoch = (await _requireEngine().groupEpoch(
      groupIdBytes: groupIdBytes,
    )).toInt();

    try {
      await _client.rpc(
        'publish_mls_membership_update_v1',"""
          new = """    final newEpoch = group.epoch + 1;

    try {
      await _client.rpc(
        'publish_mls_membership_update_v1',"""
          if old in text:
              text = text.replace(old, new, 1)

          old = """    } catch (error) {
      // The local engine already advanced. Failing closed is safer than trying
      // to synthesize a rollback of MLS ratchet state.
      throw MlsE2eeException(
        'Server rejected the MLS membership commit after local advancement. Re-open this account on the device to resynchronize. ($error)',
      );
    }

    return _fetchState(conversationId, afterEpoch: newEpoch);"""
          new = """    } catch (error) {
      await _requireEngine().clearPendingCommit(groupIdBytes: groupIdBytes);
      throw MlsE2eeException(
        'Server rejected the pending MLS membership commit; local state was not advanced. ($error)',
      );
    }

    await _requireEngine().mergePendingCommit(groupIdBytes: groupIdBytes);
    final mergedEpoch = (await _requireEngine().groupEpoch(
      groupIdBytes: groupIdBytes,
    )).toInt();
    if (mergedEpoch != newEpoch) {
      throw MlsE2eeException(
        'MLS local epoch mismatch after commit: local=$mergedEpoch expected=$newEpoch.',
      );
    }
    return _fetchState(conversationId, afterEpoch: newEpoch);"""
          if old in text:
              text = text.replace(old, new, 1)

          publish_at = text.find("'publish_mls_membership_update_v1'")
          merge_at = text.find('mergePendingCommit(groupIdBytes: groupIdBytes)', publish_at)
          if "import 'dart:async';" not in text:
              raise SystemExit('dart:async import missing')
          if publish_at < 0 or merge_at < 0:
              raise SystemExit('MLS publication/merge ordering markers missing')
          if 'clearPendingCommit(groupIdBytes: groupIdBytes)' not in text:
              raise SystemExit('MLS rejection does not clear pending commit')
          if 'final newEpoch = group.epoch + 1;' not in text:
              raise SystemExit('MLS expected epoch patch missing')
          path.write_text(text, encoding='utf-8')
          PY
          dart format lib/data/services/mls_e2ee_service.dart
          git diff --check

      - name: Toolchain
        run: |
          flutter --version
          dart --version
          java -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Hosted Auth release preflight
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: dntnxeanubswyswahdnj
        run: bash tools/check_supabase_auth_security.sh

      - name: Build release APK
        run: >-
          flutter build apk --release --no-pub
          --dart-define=SUPABASE_URL=https://dntnxeanubswyswahdnj.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_gFpVYJctaDkRRgttvnUl-A_TKu81hFF

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          cp "$APK" Chaty-production.apk
          unzip -t Chaty-production.apk >/dev/null
          sha256sum Chaty-production.apk | tee Chaty-production.apk.sha256
          ls -lh Chaty-production.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chaty-Production-APK
          path: |
            Chaty-production.apk
            Chaty-production.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified Phase 1 source patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase-1-mls-e2ee' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/data/services/mls_e2ee_service.dart; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/data/services/mls_e2ee_service.dart
          git commit -m 'fix: make MLS membership commits failure-atomic'
          git push origin HEAD:phase-1-mls-e2ee
