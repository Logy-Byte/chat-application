name: Chaty Android Production

on:
  push:
    branches:
      - main
      - production-supabase
      - production-hardening-2026-08-22
      - phase-2-encrypted-attachments
  pull_request:
    branches:
      - main
      - production-hardening-2026-08-22
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Phase 2 verified source patches
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase-2-encrypted-attachments' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_phase2_release_integration.py
          python3 tools/apply_phase2_attachment_cleanup.py
          dart format \
            lib/data/services/mls_e2ee_service.dart \
            lib/data/services/chat_media_service.dart \
            lib/data/services/voice_note_service.dart \
            lib/data/services/uploaded_attachment_guard.dart \
            lib/features/chats/chat_detail_screen.dart \
            lib/features/chats/contact_info_screen.dart \
            lib/features/messages/chat_attachment_actions.dart \
            test/uploaded_attachment_guard_test.dart
          git diff --check

      - name: Toolchain
        run: |
          flutter --version
          dart --version
          java -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Provision verified OpenMLS Linux native asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tool
          cat > tool/openmls_ci_probe.dart <<'DART'
          import 'package:openmls/openmls.dart';

          Future<void> main() async {
            await Openmls.init();
            Openmls.cleanup();
          }
          DART
          dart run tool/openmls_ci_probe.dart
          rm -f tool/openmls_ci_probe.dart

      - name: Test encrypted attachment crypto
        run: flutter test test/encrypted_attachment_codec_test.dart

      - name: Test uploaded ciphertext cleanup
        run: flutter test test/uploaded_attachment_guard_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Hosted Auth release preflight
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: dntnxeanubswyswahdnj
        run: bash tools/check_supabase_auth_security.sh

      - name: Build release APK
        run: >-
          flutter build apk --release --no-pub
          --dart-define=SUPABASE_URL=https://dntnxeanubswyswahdnj.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_gFpVYJctaDkRRgttvnUl-A_TKu81hFF

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          cp "$APK" Chaty-production.apk
          unzip -t Chaty-production.apk >/dev/null
          sha256sum Chaty-production.apk | tee Chaty-production.apk.sha256
          ls -lh Chaty-production.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chaty-Production-APK
          path: |
            Chaty-production.apk
            Chaty-production.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified Phase 2 source
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase-2-encrypted-attachments' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/data/services/mls_e2ee_service.dart \
            lib/data/services/chat_media_service.dart \
            lib/data/services/voice_note_service.dart \
            lib/features/chats/chat_detail_screen.dart \
            lib/features/chats/contact_info_screen.dart \
            lib/features/messages/chat_attachment_actions.dart
          git commit -m 'fix: complete encrypted attachment send lifecycle'
          git push origin HEAD:phase-2-encrypted-attachments
