name: Phase 7 Trusted Account UI Runner

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [production-hardening-2026-08-22]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'phase-7-platform-security'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase-7-platform-security
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/features/settings/settings_root_screen.dart')
          text = path.read_text()
          if "title: 'Delete account'" in text:
              raise SystemExit(0)

          pattern = re.compile(
              r"(?P<tile>\s*ChatySettingsTile\(\s*"
              r"icon:\s*Icons\.logout_rounded,\s*"
              r"iconColor:\s*Theme\.of\(context\)\.colorScheme\.error,\s*"
              r"title:\s*'Log out',\s*"
              r"subtitle:\s*'Sign out of this Chaty account on this device',\s*"
              r"onTap:\s*\(\)\s*=>\s*_logout\(context\),\s*"
              r"\),)"
          )
          match = pattern.search(text)
          if match is None:
              raise SystemExit('logout tile not found')

          indent_match = re.search(r"\n([ \t]*)ChatySettingsTile\(", match.group('tile'))
          indent = indent_match.group(1) if indent_match else '              '
          delete_tile = f"""
{indent}ChatySettingsTile(
{indent}  icon: Icons.delete_forever_rounded,
{indent}  iconColor: Theme.of(context).colorScheme.error,
{indent}  title: 'Delete account',
{indent}  subtitle: 'Permanently delete this account and owned media',
{indent}  onTap: () => confirmChatyDeleteAccount(context),
{indent}),"""
          text = text[:match.end()] + delete_tile + text[match.end():]
          path.write_text(text)
          PY
          dart format lib/features/settings/settings_root_screen.dart
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/settings/settings_root_screen.dart
          git commit -m 'feat: expose secure account deletion in settings'
          git push origin HEAD:phase-7-platform-security
