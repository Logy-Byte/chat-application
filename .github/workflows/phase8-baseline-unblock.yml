name: Phase 8 Baseline Unblock

on:
  push:
    branches: [phase-8-release-hardening]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase-8-release-hardening
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/data/services/mls_e2ee_service.dart')
          text = path.read_text()
          if "import 'dart:async';" not in text:
              text = text.replace("import 'dart:convert';", "import 'dart:async';\nimport 'dart:convert';", 1)
              path.write_text(text)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/data/services/mls_e2ee_service.dart
          git commit -m 'fix: unblock inherited MLS async compile baseline'
          git push origin HEAD:phase-8-release-hardening
