name: Phase 5 Settings Runtime Consumer Audit

on:
  push:
    branches: [phase-5-feature-correctness]
  pull_request:
    branches: [production-hardening-2026-08-22]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python tools/audit_gb_runtime_consumers.py
