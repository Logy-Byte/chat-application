name: Phase 8 Release Gate

on:
  push:
    branches: [phase-8-release-hardening]
  pull_request:
    branches: [production-hardening-2026-08-22]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Phase 8 production-source cleanup
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase-8-release-hardening' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_phase8_remove_call_qa.py
          dart format \
            lib/data/services/call_signaling_service.dart \
            lib/features/calls/calls_screen.dart
          git diff --check

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: bash tools/check_migration_versions.sh
      - run: bash tools/check_no_production_mocks.sh
      - run: >-
          flutter build apk --release --no-pub
          --dart-define=SUPABASE_URL=https://dntnxeanubswyswahdnj.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_gFpVYJctaDkRRgttvnUl-A_TKu81hFF
      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"

      - name: Commit verified production-source cleanup
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase-8-release-hardening' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/data/services/call_signaling_service.dart lib/features/calls/calls_screen.dart; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/data/services/call_signaling_service.dart \
            lib/features/calls/calls_screen.dart
          git commit -m 'chore: remove production QA call execution paths'
          git push origin HEAD:phase-8-release-hardening
