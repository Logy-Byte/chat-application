name: Phase 8 Release Gate

on:
  push:
    branches: [phase-8-release-hardening]
  pull_request:
    branches: [production-hardening-2026-08-22]
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPABASE_URL: https://dntnxeanubswyswahdnj.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_gFpVYJctaDkRRgttvnUl-A_TKu81hFF

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      # Explicitly permitted only for compile/test verification. build.gradle
      # fails closed on release tasks without this flag or real signing creds.
      CHATY_ALLOW_CI_DEBUG_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Phase 8 production-source cleanup
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase-8-release-hardening' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_phase8_remove_call_qa.py
          dart format \
            lib/data/services/call_signaling_service.dart \
            lib/features/calls/calls_screen.dart
          git diff --check

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: bash tools/check_migration_versions.sh
      - run: bash tools/check_no_production_mocks.sh
      - name: Build release-mode verification APK
        run: >-
          flutter build apk --release --no-pub
          --dart-define=SUPABASE_URL=${SUPABASE_URL}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - name: Verify release-mode APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"

      - name: Commit verified production-source cleanup
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase-8-release-hardening' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/data/services/call_signaling_service.dart lib/features/calls/calls_screen.dart; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/data/services/call_signaling_service.dart \
            lib/features/calls/calls_screen.dart
          git commit -m 'chore: remove production QA call execution paths'
          git push origin HEAD:phase-8-release-hardening

  signed-production:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CHATY_APPLICATION_ID: ${{ vars.CHATY_APPLICATION_ID }}
      CHATY_ANDROID_STORE_PASSWORD: ${{ secrets.CHATY_ANDROID_STORE_PASSWORD }}
      CHATY_ANDROID_KEY_ALIAS: ${{ secrets.CHATY_ANDROID_KEY_ALIAS }}
      CHATY_ANDROID_KEY_PASSWORD: ${{ secrets.CHATY_ANDROID_KEY_PASSWORD }}
      CHATY_TURN_URL: ${{ secrets.CHATY_TURN_URL }}
      CHATY_TURN_USERNAME: ${{ secrets.CHATY_TURN_USERNAME }}
      CHATY_TURN_CREDENTIAL: ${{ secrets.CHATY_TURN_CREDENTIAL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: dntnxeanubswyswahdnj
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Provision and validate production signing
        shell: bash
        env:
          CHATY_ANDROID_KEYSTORE_BASE64: ${{ secrets.CHATY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$CHATY_APPLICATION_ID"
          case "$CHATY_APPLICATION_ID" in com.example.*) exit 1 ;; esac
          test -n "$CHATY_ANDROID_KEYSTORE_BASE64"
          test -n "$CHATY_ANDROID_STORE_PASSWORD"
          test -n "$CHATY_ANDROID_KEY_ALIAS"
          test -n "$CHATY_ANDROID_KEY_PASSWORD"
          test -n "$CHATY_TURN_URL"
          test -n "$CHATY_TURN_USERNAME"
          test -n "$CHATY_TURN_CREDENTIAL"
          test -n "$SUPABASE_ACCESS_TOKEN"
          KEYSTORE="$RUNNER_TEMP/chaty-production.jks"
          printf '%s' "$CHATY_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "CHATY_ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - run: flutter pub get
      - name: Hosted Supabase Auth security preflight
        run: bash tools/check_supabase_auth_security.sh
      - run: bash tools/check_migration_versions.sh
      - run: bash tools/check_no_production_mocks.sh
      - name: Build signed production APK
        run: >-
          flutter build apk --release --no-pub
          --dart-define=SUPABASE_URL=${SUPABASE_URL}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
          --dart-define=CHATY_TURN_URL=${CHATY_TURN_URL}
          --dart-define=CHATY_TURN_USERNAME=${CHATY_TURN_USERNAME}
          --dart-define=CHATY_TURN_CREDENTIAL=${CHATY_TURN_CREDENTIAL}
      - name: Verify production APK signature and hash
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee Chaty-production.apk.sha256
          cp "$APK" Chaty-production.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Chaty-Production-APK
          path: |
            Chaty-production.apk
            Chaty-production.apk.sha256
          if-no-files-found: error
          retention-days: 30
