name: Chaty Frontend Master Plan

on:
  push:
    branches: [integration/phases-1-8]
  pull_request:
    branches: [integration/phases-1-8]
  workflow_dispatch:

permissions:
  contents: write

env:
  CHATY_ALLOW_CI_DEBUG_SIGNING: 'true'

jobs:
  verify-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply canonical frontend plan on integration branch
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/integration/phases-1-8' &&
          github.actor != 'github-actions[bot]'
        run: python3 tools/apply_frontend_master_plan.py

      - name: Format frontend implementation
        run: >-
          dart format
          lib/main.dart
          lib/features/chats/main_navigation_shell.dart
          lib/features/chats/chats_home_screen.dart
          lib/features/messages/attachment_sheet.dart
          lib/features/settings/settings_root_screen.dart
          lib/features/updates/updates_screen.dart
          lib/features/ui_lab
          lib/ui/core/design_system/chaty_motion.dart
          lib/ui/core/design_system/chaty_haptics.dart
          lib/ui/core/design_system/chaty_adaptive.dart
          lib/ui/core/design_system/component_state.dart
          lib/ui/core/design_system/components
          lib/ui/core/design_system/design_system.dart
          test/frontend_master_plan_contract_test.dart

      - name: Diff sanity
        run: git diff --check

      - name: Resolve dependencies
        run: flutter pub get

      - name: Provision OpenMLS native test asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tool
          cat > tool/openmls_ci_probe.dart <<'DART'
          import 'package:openmls/openmls.dart';
          Future<void> main() async {
            await Openmls.init();
            Openmls.cleanup();
          }
          DART
          dart run tool/openmls_ci_probe.dart
          rm -f tool/openmls_ci_probe.dart

      - name: Frontend contract tests
        run: flutter test test/frontend_master_plan_contract_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Full Flutter test suite
        run: flutter test

      - name: Reject production mocks and QA paths
        run: bash tools/check_no_production_mocks.sh

      - name: Commit verified frontend source
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/integration/phases-1-8' &&
          github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Frontend source already matches the verified master plan.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ui: apply verified Chaty frontend master plan foundation'
          git push origin HEAD:integration/phases-1-8
