name: Chaty Integrated Production Gate

on:
  push:
    branches: [integration/phases-1-8]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPABASE_URL: https://dntnxeanubswyswahdnj.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_gFpVYJctaDkRRgttvnUl-A_TKu81hFF

jobs:
  verify-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CHATY_ALLOW_CI_DEBUG_SIGNING: 'true'
    steps:
      - name: Checkout integrated branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch isolated phase heads
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/integration/phases-1-8' && github.actor != 'github-actions[bot]') ||
          (github.event_name == 'pull_request' && github.head_ref == 'integration/phases-1-8')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            '+refs/heads/phase-2-encrypted-attachments:refs/remotes/origin/phase-2-encrypted-attachments' \
            '+refs/heads/phase-3-calls-transport:refs/remotes/origin/phase-3-calls-transport' \
            '+refs/heads/phase-4-realtime-offline:refs/remotes/origin/phase-4-realtime-offline' \
            '+refs/heads/phase-5-feature-correctness:refs/remotes/origin/phase-5-feature-correctness' \
            '+refs/heads/phase-6-ui-ux-consistency:refs/remotes/origin/phase-6-ui-ux-consistency' \
            '+refs/heads/phase-7-platform-security:refs/remotes/origin/phase-7-platform-security'

      - name: Apply verified phase and device integration
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/integration/phases-1-8' && github.actor != 'github-actions[bot]') ||
          (github.event_name == 'pull_request' && github.head_ref == 'integration/phases-1-8')
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_release_integration.py
          python3 tools/apply_account_deletion_purge.py
          python3 tools/apply_device_fixes_and_signature_ux.py
          python3 tools/apply_signature_followups.py
          dart format \
            lib/data/repositories/chaty_data_store.dart \
            lib/data/services/backend_service.dart \
            lib/data/services/call_history_service.dart \
            lib/data/services/call_signaling_service.dart \
            lib/data/services/chat_media_service.dart \
            lib/data/services/encrypted_attachment_codec.dart \
            lib/data/services/encrypted_message_outbox.dart \
            lib/data/services/mls_e2ee_service.dart \
            lib/data/services/uploaded_attachment_guard.dart \
            lib/data/services/voice_note_service.dart \
            lib/domain/models/chat_message.dart \
            lib/features/chats/chat_detail_screen.dart \
            lib/features/chats/chats_home_screen.dart \
            lib/features/chats/contact_info_screen.dart \
            lib/features/chats/main_navigation_shell.dart \
            lib/features/chats/root_navigation_policy.dart \
            lib/features/messages/chat_attachment_actions.dart \
            lib/features/messages/media_viewer_screen.dart \
            lib/features/messages/message_action_sheet.dart \
            lib/features/messages/message_bubble.dart \
            lib/features/profile/profile_actions.dart \
            lib/features/search/global_search_screen.dart \
            lib/features/settings/security/security_center_screen.dart \
            lib/features/settings/settings_root_screen.dart \
            lib/ui/core/design_system/components/signature_components.dart \
            lib/ui/core/design_system/components/state_views.dart \
            lib/ui/core/design_system/design_system.dart \
            lib/ui/core/theme/theme_controller.dart \
            lib/ui/core/theme/theme_presets.dart \
            test/account_deletion_purge_contract_test.dart \
            test/encrypted_attachment_codec_test.dart \
            test/encrypted_message_outbox_test.dart \
            test/phase5_feature_contracts_test.dart \
            test/phase6_state_views_test.dart \
            test/root_navigation_policy_test.dart \
            test/uploaded_attachment_guard_test.dart
          git diff --check

      - name: Resolve dependencies
        run: flutter pub get

      - name: Provision verified OpenMLS Linux native asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tool
          cat > tool/openmls_ci_probe.dart <<'DART'
          import 'package:openmls/openmls.dart';
          Future<void> main() async {
            await Openmls.init();
            Openmls.cleanup();
          }
          DART
          dart run tool/openmls_ci_probe.dart
          rm -f tool/openmls_ci_probe.dart

      - name: Runtime settings consumer audit
        run: python3 tools/audit_gb_runtime_consumers.py

      - name: Test encrypted attachment crypto
        run: flutter test test/encrypted_attachment_codec_test.dart

      - name: Test uploaded ciphertext cleanup
        run: flutter test test/uploaded_attachment_guard_test.dart

      - name: Test encrypted offline outbox
        run: flutter test test/encrypted_message_outbox_test.dart

      - name: Test account-deletion local purge contract
        run: flutter test test/account_deletion_purge_contract_test.dart

      - name: Test navigation and feature contracts
        run: flutter test test/root_navigation_policy_test.dart test/phase5_feature_contracts_test.dart

      - name: Test shared state views
        run: flutter test test/phase6_state_views_test.dart

      - name: Test call lifecycle policy
        run: flutter test test/call_lifecycle_policy_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Full Flutter test suite
        run: flutter test

      - name: Verify migration ledger
        run: bash tools/check_migration_versions.sh

      - name: Reject production mocks/placeholders
        run: bash tools/check_no_production_mocks.sh

      - name: Harden and verify hosted Auth when management credential is available
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: dntnxeanubswyswahdnj
        run: bash tools/harden_supabase_auth.sh

      - name: Build release-mode verification APK
        run: >-
          flutter build apk --release --no-pub
          --dart-define=SUPABASE_URL=${SUPABASE_URL}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}

      - name: Verify release-mode APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee Chaty-integration.apk.sha256

      - name: Commit verified integrated source
        if: github.event_name == 'push' && github.ref == 'refs/heads/integration/phases-1-8' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: integrate verified device fixes and Chaty UX'
          git push origin HEAD:integration/phases-1-8

  signed-production:
    if: github.event_name == 'workflow_dispatch'
    needs: verify-integration
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    env:
      CHATY_APPLICATION_ID: ${{ vars.CHATY_APPLICATION_ID }}
      CHATY_ANDROID_STORE_PASSWORD: ${{ secrets.CHATY_ANDROID_STORE_PASSWORD }}
      CHATY_ANDROID_KEY_ALIAS: ${{ secrets.CHATY_ANDROID_KEY_ALIAS }}
      CHATY_ANDROID_KEY_PASSWORD: ${{ secrets.CHATY_ANDROID_KEY_PASSWORD }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: dntnxeanubswyswahdnj
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Provision and validate production credentials
        shell: bash
        env:
          CHATY_ANDROID_KEYSTORE_BASE64: ${{ secrets.CHATY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$CHATY_APPLICATION_ID"
          case "$CHATY_APPLICATION_ID" in com.example.*) echo 'Example package id is forbidden'; exit 1 ;; esac
          test -n "$CHATY_ANDROID_KEYSTORE_BASE64"
          test -n "$CHATY_ANDROID_STORE_PASSWORD"
          test -n "$CHATY_ANDROID_KEY_ALIAS"
          test -n "$CHATY_ANDROID_KEY_PASSWORD"
          test -n "$SUPABASE_ACCESS_TOKEN"
          KEYSTORE="$RUNNER_TEMP/chaty-production.jks"
          printf '%s' "$CHATY_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "CHATY_ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: bash tools/check_migration_versions.sh
      - run: bash tools/check_no_production_mocks.sh
      - name: Harden and verify hosted Auth
        run: bash tools/harden_supabase_auth.sh

      - name: Build signed production APK
        run: >-
          flutter build apk --release --no-pub
          --dart-define=SUPABASE_URL=${SUPABASE_URL}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}

      - name: Verify production APK signature and hash
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" Chaty-production.apk
          sha256sum Chaty-production.apk | tee Chaty-production.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Chaty-Production-APK
          path: |
            Chaty-production.apk
            Chaty-production.apk.sha256
          if-no-files-found: error
          retention-days: 30
