name: Phase 3 Calls Verification

on:
  push:
    branches: [phase-3-calls-transport]
  pull_request:
    branches: [production-hardening-2026-08-22]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Provision verified OpenMLS Linux native asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tool
          cat > tool/openmls_ci_probe.dart <<'DART'
          import 'package:openmls/openmls.dart';

          Future<void> main() async {
            await Openmls.init();
            Openmls.cleanup();
          }
          DART
          dart run tool/openmls_ci_probe.dart
          rm -f tool/openmls_ci_probe.dart
      - run: flutter analyze --no-fatal-infos
      - run: flutter test test/call_lifecycle_policy_test.dart
      - run: flutter test
      - run: >-
          flutter build apk --release --no-pub
          --dart-define=SUPABASE_URL=https://dntnxeanubswyswahdnj.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_gFpVYJctaDkRRgttvnUl-A_TKu81hFF
