name: One-shot Phase 2 Attachment Wire-up

on:
  push:
    branches:
      - phase-2-encrypted-attachments

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'feat: wire encrypted attachments through MLS and local media'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase-2-encrypted-attachments
          fetch-depth: 0

      - name: Apply reviewed Phase 2 source patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Expected source block not found: {label}')
              return text.replace(old, new, 1)

          # Backend: attachment keys/nonces/MAC remain only inside the MLS payload.
          path = Path('lib/data/services/backend_service.dart')
          text = path.read_text()
          text = replace_once(text,
          """          'duration_seconds': attachment.durationSeconds,
        },""",
          """          'duration_seconds': attachment.durationSeconds,
          'encryption_version': attachment.encryptionVersion,
          'encryption_algorithm': attachment.encryptionAlgorithm,
          'encryption_key': attachment.encryptionKeyBase64,
          'encryption_nonce': attachment.encryptionNonceBase64,
          'encryption_mac': attachment.encryptionMacBase64,
          'original_mime_type': attachment.originalMimeType,
          'original_size_bytes': attachment.originalSizeBytes,
        },""", 'backend attachment serialize')
          text = replace_once(text,
          """              durationSeconds: _integer(attachmentJson['duration_seconds']),
            ),""",
          """              durationSeconds: _integer(attachmentJson['duration_seconds']),
              encryptionVersion: _integer(attachmentJson['encryption_version']),
              encryptionAlgorithm: attachmentJson['encryption_algorithm']?.toString(),
              encryptionKeyBase64: attachmentJson['encryption_key']?.toString(),
              encryptionNonceBase64: attachmentJson['encryption_nonce']?.toString(),
              encryptionMacBase64: attachmentJson['encryption_mac']?.toString(),
              originalMimeType: attachmentJson['original_mime_type']?.toString(),
              originalSizeBytes: attachmentJson['original_size_bytes'] == null
                  ? null
                  : _integer(attachmentJson['original_size_bytes']),
            ),""", 'backend attachment hydrate')
          path.write_text(text)

          # MLS: compile fix plus failure-atomic membership commits.
          path = Path('lib/data/services/mls_e2ee_service.dart')
          text = path.read_text()
          if "import 'dart:async';" not in text:
              text = text.replace("import 'dart:convert';", "import 'dart:async';\nimport 'dart:convert';", 1)
          old = """    await _requireEngine().mergePendingCommit(groupIdBytes: groupIdBytes);
    final newEpoch = (await _requireEngine().groupEpoch(
      groupIdBytes: groupIdBytes,
    )).toInt();

    try {
      await _client.rpc(
        'publish_mls_membership_update_v1',"""
          new = """    final newEpoch = group.epoch + 1;

    try {
      await _client.rpc(
        'publish_mls_membership_update_v1',"""
          text = replace_once(text, old, new, 'MLS publish before local merge')
          old = """    } catch (error) {
      // The local engine already advanced. Failing closed is safer than trying
      // to synthesize a rollback of MLS ratchet state.
      throw MlsE2eeException(
        'Server rejected the MLS membership commit after local advancement. Re-open this account on the device to resynchronize. ($error)',
      );
    }

    return _fetchState(conversationId, afterEpoch: newEpoch);"""
          new = """    } catch (error) {
      await _requireEngine().clearPendingCommit(groupIdBytes: groupIdBytes);
      throw MlsE2eeException(
        'Server rejected the pending MLS membership commit; local state was not advanced. ($error)',
      );
    }

    await _requireEngine().mergePendingCommit(groupIdBytes: groupIdBytes);
    final mergedEpoch = (await _requireEngine().groupEpoch(
      groupIdBytes: groupIdBytes,
    )).toInt();
    if (mergedEpoch != newEpoch) {
      throw MlsE2eeException(
        'MLS local epoch mismatch after commit: local=$mergedEpoch expected=$newEpoch.',
      );
    }
    return _fetchState(conversationId, afterEpoch: newEpoch);"""
          text = replace_once(text, old, new, 'MLS failure atomic completion')
          path.write_text(text)

          # Media service compile cleanup.
          path = Path('lib/data/services/chat_media_service.dart')
          text = path.read_text().replace(
              "throw const FileSystemException('Downloaded attachment is empty.');",
              "throw FileSystemException('Downloaded attachment is empty.');")
          path.write_text(text)

          # Bubble consumers: ciphertext is never fed to media decoders.
          path = Path('lib/features/messages/message_bubble.dart')
          text = path.read_text()
          if "import 'dart:io';" not in text:
              text = text.replace("import 'dart:async';", "import 'dart:async';\nimport 'dart:io';", 1)
          text = replace_once(text,
          """                            _SignedImagePreview(
                              storagePath: message.attachment!.url,
                              semanticLabel: message.attachment!.name,
                              onTap: onMediaTap,
                            ),""",
          """                            _SignedImagePreview(
                              conversationId: message.conversationId,
                              attachment: message.attachment!,
                              semanticLabel: message.attachment!.name,
                              onTap: onMediaTap,
                            ),""", 'image preview invocation')
          text = replace_once(text,
          """                            _SignedVideoPreview(
                              attachment: message.attachment!,
                              onOpen: onMediaTap,
                            ),""",
          """                            _SignedVideoPreview(
                              conversationId: message.conversationId,
                              attachment: message.attachment!,
                              onOpen: onMediaTap,
                            ),""", 'video preview invocation')
          text = replace_once(text,
          """                          _VoiceNotePlayer(
                            attachment: message.attachment!,
                            textColor: textColor,""",
          """                          _VoiceNotePlayer(
                            conversationId: message.conversationId,
                            attachment: message.attachment!,
                            textColor: textColor,""", 'voice invocation')

          start = text.index('class _SignedImagePreview extends StatefulWidget')
          end = text.index('class _SignedVideoPreview extends StatefulWidget')
          image_class = r'''class _SignedImagePreview extends StatefulWidget {
  final String conversationId;
  final MessageAttachment attachment;
  final String semanticLabel;
  final VoidCallback? onTap;
  const _SignedImagePreview({
    required this.conversationId,
    required this.attachment,
    required this.semanticLabel,
    this.onTap,
  });

  @override
  State<_SignedImagePreview> createState() => _SignedImagePreviewState();
}

class _SignedImagePreviewState extends State<_SignedImagePreview> {
  late final Future<File> _file;

  @override
  void initState() {
    super.initState();
    _file = ChatMediaService().resolveToLocalFile(
      conversationId: widget.conversationId,
      attachment: widget.attachment,
    );
  }

  @override
  Widget build(BuildContext context) {
    return Semantics(
      image: true,
      label: widget.semanticLabel,
      child: InkWell(
        onTap: widget.onTap,
        borderRadius: BorderRadius.circular(12),
        child: ClipRRect(
          borderRadius: BorderRadius.circular(12),
          child: SizedBox(
            width: 270,
            height: 200,
            child: FutureBuilder<File>(
              future: _file,
              builder: (context, snapshot) {
                if (snapshot.connectionState != ConnectionState.done) {
                  return const ColoredBox(
                    color: Colors.black26,
                    child: Center(
                      child: CircularProgressIndicator(strokeWidth: 2),
                    ),
                  );
                }
                final file = snapshot.data;
                if (snapshot.hasError || file == null) {
                  return const ColoredBox(
                    color: Colors.black26,
                    child: Center(child: Icon(Icons.broken_image_outlined)),
                  );
                }
                return Image.file(
                  file,
                  fit: BoxFit.cover,
                  gaplessPlayback: true,
                  errorBuilder: (_, __, ___) => const ColoredBox(
                    color: Colors.black26,
                    child: Center(child: Icon(Icons.broken_image_outlined)),
                  ),
                );
              },
            ),
          ),
        ),
      ),
    );
  }
}

'''
          text = text[:start] + image_class + text[end:]

          text = replace_once(text,
          """class _SignedVideoPreview extends StatefulWidget {
  final MessageAttachment attachment;
  final VoidCallback? onOpen;
  const _SignedVideoPreview({required this.attachment, this.onOpen});""",
          """class _SignedVideoPreview extends StatefulWidget {
  final String conversationId;
  final MessageAttachment attachment;
  final VoidCallback? onOpen;
  const _SignedVideoPreview({
    required this.conversationId,
    required this.attachment,
    this.onOpen,
  });""", 'video preview class header')
          text = replace_once(text,
          """      final path = widget.attachment.url;
      if (path == null || path.isEmpty) throw Exception('Missing video path');
      final signed = await ChatMediaService().createSignedUrl(
        path,
        expiresInSeconds: 3600,
      );
      final controller = VideoPlayerController.networkUrl(Uri.parse(signed));""",
          """      final file = await ChatMediaService().resolveToLocalFile(
        conversationId: widget.conversationId,
        attachment: widget.attachment,
      );
      final controller = VideoPlayerController.file(file);""", 'video local decrypt')
          text = replace_once(text,
          """class _VoiceNotePlayer extends StatefulWidget {
  final MessageAttachment attachment;
  final Color textColor;""",
          """class _VoiceNotePlayer extends StatefulWidget {
  final String conversationId;
  final MessageAttachment attachment;
  final Color textColor;""", 'voice class field')
          text = replace_once(text,
          """  const _VoiceNotePlayer({
    required this.attachment,
    required this.textColor,""",
          """  const _VoiceNotePlayer({
    required this.conversationId,
    required this.attachment,
    required this.textColor,""", 'voice class constructor')
          text = replace_once(text,
          """        final path = widget.attachment.url;
        if (path == null || path.isEmpty)
          throw Exception('Voice note path is missing.');
        final url = await ChatMediaService().createSignedUrl(
          path,
          expiresInSeconds: 3600,
        );
        _duration = await _player.setUrl(url);""",
          """        final file = await ChatMediaService().resolveToLocalFile(
          conversationId: widget.conversationId,
          attachment: widget.attachment,
        );
        _duration = await _player.setFilePath(file.path);""", 'voice local decrypt')
          path.write_text(text)

          # Media viewer callers now provide the full MLS-protected attachment metadata.
          path = Path('lib/features/chats/chat_detail_screen.dart')
          text = path.read_text()
          pattern = re.compile(r"MediaViewerScreen\(\s*title: attachment\.name,\s*type: attachment\.type,\s*size: attachment\.size,\s*storagePath: attachment\.url,\s*theme: theme,\s*\)", re.S)
          text, count1 = pattern.subn("MediaViewerScreen(\n          theme: theme,\n          conversationId: widget.conversationId,\n          attachment: attachment,\n        )", text, count=1)
          pattern2 = re.compile(r"MediaViewerScreen\(\s*title: message\.attachment!\.name,\s*type: message\.attachment!\.type,\s*size: message\.attachment!\.size,\s*storagePath: message\.attachment!\.url,\s*theme: theme,\s*\)", re.S)
          text, count2 = pattern2.subn("MediaViewerScreen(\n                        theme: theme,\n                        conversationId: widget.conversationId,\n                        attachment: message.attachment!,\n                      )", text, count=1)
          if count1 != 1 or count2 != 1:
              raise SystemExit(f'chat detail viewer replacement count mismatch: {count1}/{count2}')
          path.write_text(text)

          path = Path('lib/features/chats/contact_info_screen.dart')
          text = path.read_text()
          pattern = re.compile(r"MediaViewerScreen\(\s*title: attachment\.name,\s*type: attachment\.type,\s*size: attachment\.size,\s*storagePath: attachment\.url,\s*theme: widget\.theme,\s*\)", re.S)
          text, count = pattern.subn("MediaViewerScreen(\n          theme: widget.theme,\n          conversationId: widget.conversation.id,\n          attachment: attachment,\n        )", text, count=1)
          if count != 1:
              raise SystemExit('contact info viewer replacement count mismatch')
          path.write_text(text)

          # Compensating Storage cleanup if the encrypted MLS message never commits.
          path = Path('lib/features/messages/chat_attachment_actions.dart')
          text = path.read_text()
          text = replace_once(text,
          """        for (final attachment in items) {
          await dataStore.sendMessage(
            conversationId: conversationId,
            text: '',
            type: _messageType(type),
            attachment: attachment,
          );
        }""",
          """        for (var index = 0; index < items.length; index++) {
          final attachment = items[index];
          try {
            await dataStore.sendMessage(
              conversationId: conversationId,
              text: '',
              type: _messageType(type),
              attachment: attachment,
            );
          } catch (_) {
            for (var cleanup = index; cleanup < items.length; cleanup++) {
              final path = items[cleanup].url;
              if (path != null) await _media.deleteOwnAttachment(path);
            }
            rethrow;
          }
        }""", 'multi attachment cleanup')
          text = replace_once(text,
          """        await dataStore.sendMessage(
          conversationId: conversationId,
          text: '',
          type: _messageType(type),
          attachment: attachment,
          extraMetadata: viewOnce
              ? const <String, dynamic>{'view_once': true}
              : null,
        );""",
          """        try {
          await dataStore.sendMessage(
            conversationId: conversationId,
            text: '',
            type: _messageType(type),
            attachment: attachment,
            extraMetadata: viewOnce
                ? const <String, dynamic>{'view_once': true}
                : null,
          );
        } catch (_) {
          final path = attachment.url;
          if (path != null) await _media.deleteOwnAttachment(path);
          rethrow;
        }""", 'single attachment cleanup')
          text = replace_once(text,
          """      await dataStore.sendMessage(
        conversationId: conversationId,
        text: '',
        type: MessageType.audio,
        attachment: attachment,
      );""",
          """      try {
        await dataStore.sendMessage(
          conversationId: conversationId,
          text: '',
          type: MessageType.audio,
          attachment: attachment,
        );
      } catch (_) {
        final path = attachment.url;
        if (path != null) await _media.deleteOwnAttachment(path);
        rethrow;
      }""", 'voice attachment cleanup')
          path.write_text(text)

          for file in [
              'lib/data/services/backend_service.dart',
              'lib/data/services/mls_e2ee_service.dart',
              'lib/data/services/chat_media_service.dart',
              'lib/features/messages/message_bubble.dart',
              'lib/features/messages/chat_attachment_actions.dart',
              'lib/features/chats/chat_detail_screen.dart',
              'lib/features/chats/contact_info_screen.dart']:
              if '\t' in Path(file).read_text():
                  raise SystemExit(f'tab introduced in {file}')
          PY
          dart format \
            lib/data/services/backend_service.dart \
            lib/data/services/mls_e2ee_service.dart \
            lib/data/services/chat_media_service.dart \
            lib/features/messages/message_bubble.dart \
            lib/features/messages/chat_attachment_actions.dart \
            lib/features/chats/chat_detail_screen.dart \
            lib/features/chats/contact_info_screen.dart
          git diff --check

      - name: Commit Phase 2 wire-up
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/
          git commit -m 'feat: wire encrypted attachments through MLS and local media'
          git push origin HEAD:phase-2-encrypted-attachments
