name: Phase 2 Reviewed Patch Push Runner

on:
  push:
    branches:
      - phase-2-encrypted-attachments

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase-2-encrypted-attachments
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix verified encrypted-media integration gaps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          mls = Path('lib/data/services/mls_e2ee_service.dart')
          text = mls.read_text()
          if "import 'dart:async';" not in text:
              text = text.replace(
                  "import 'dart:convert';",
                  "import 'dart:async';\nimport 'dart:convert';",
                  1,
              )
          if "import 'dart:async';" not in text:
              raise SystemExit('Could not add dart:async to MLS service')
          mls.write_text(text)

          detail = Path('lib/features/chats/chat_detail_screen.dart')
          text = detail.read_text()
          replacements = [
              (
                  """        builder: (_) => MediaViewerScreen(
          title: attachment.name,
          type: attachment.type,
          size: attachment.size,
          storagePath: attachment.url,
          theme: theme,
        ),""",
                  """        builder: (_) => MediaViewerScreen(
          theme: theme,
          conversationId: message.conversationId,
          attachment: attachment,
        ),""",
                  'view-once media viewer',
              ),
              (
                  """                      builder: (_) => MediaViewerScreen(
                        title: message.attachment!.name,
                        type: message.attachment!.type,
                        size: message.attachment!.size,
                        storagePath: message.attachment!.url,
                        theme: theme,
                      ),""",
                  """                      builder: (_) => MediaViewerScreen(
                        theme: theme,
                        conversationId: message.conversationId,
                        attachment: message.attachment!,
                      ),""",
                  'message media viewer',
              ),
          ]
          for old, new, label in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Expected source block not found: {label}')
              text = text.replace(old, new, 1)
          detail.write_text(text)

          contact = Path('lib/features/chats/contact_info_screen.dart')
          text = contact.read_text()
          old = """        builder: (_) => MediaViewerScreen(
          title: attachment.name,
          type: attachment.type,
          size: attachment.size,
          storagePath: attachment.url,
          theme: widget.theme,
        ),"""
          new = """        builder: (_) => MediaViewerScreen(
          theme: widget.theme,
          conversationId: message.conversationId,
          attachment: attachment,
        ),"""
          if new not in text:
              if old not in text:
                  raise SystemExit('Expected source block not found: contact media viewer')
              text = text.replace(old, new, 1)
          contact.write_text(text)
          PY

          dart format \
            lib/data/services/mls_e2ee_service.dart \
            lib/features/chats/chat_detail_screen.dart \
            lib/features/chats/contact_info_screen.dart
          flutter analyze --no-fatal-infos
          git diff --check

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/data/services/mls_e2ee_service.dart \
            lib/features/chats/chat_detail_screen.dart \
            lib/features/chats/contact_info_screen.dart
          git commit -m 'fix: complete encrypted attachment viewer integration'
          git push origin HEAD:phase-2-encrypted-attachments
