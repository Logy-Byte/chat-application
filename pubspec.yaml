name: chat
description: "Chaty private, customizable messaging."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.0.0
  local_auth: '>=2.3.0 <3.0.0'
  get_it: ^9.2.1
  url_launcher: ^6.3.1
  permission_handler: ^11.4.0
  supabase_flutter: ^2.0.0
  uuid: ^4.5.1
  cryptography: ^2.9.0
  file_picker: ^12.0.0
  mime: ^2.0.0
  geolocator: ^14.0.3
  flutter_contacts: ^2.3.1
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  record: ^7.1.1
  just_audio: ^0.10.5
  share_plus: ^13.3.0
  flutter_image_compress: ^2.5.1
  animated_emoji: ^3.3.0
  emoji_picker_flutter: ^4.5.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  video_player: ^2.14.0
  flutter_webrtc: ^1.6.0
  flutter_foreground_task: ^11.0.1
  openmls: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/app_icon.png

dependency_overrides:
  # Repository-owned OpenMLS fork: Rust std file locking is unsupported on
  # Android, so the fork uses fs4/flock only for that target.
  openmls:
    path: third_party/openmls_android
  # openmls ships FRB codegen 2.12.0; a newer transitive runtime fails its sanity check.
  flutter_rust_bridge: 2.12.0
